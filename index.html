<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Time Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div>
          <p class="eyebrow">DAILY WORK LOG</p>
          <h1>Work Time Tracker</h1>
        </div>
      </div>
    </header>

    <main>
      <section class="timer-panel" aria-labelledby="timerHeading">
        <div class="timer-panel-heading">
          <div>
            <p class="eyebrow">TODAY'S TOTAL</p>
            <h2 id="timerHeading">Work time</h2>
          </div>
          <time id="todayDate" class="timer-panel-index"></time>
        </div>
        <div class="timer-panel-controls">
          <div id="timer" aria-live="polite">00:00:00</div>
          <div class="timer-controls">
            <button id="startPauseBtn" class="timer-action timer-action-primary" type="button">Start</button>
            <button id="resetBtn" class="timer-action timer-action-secondary" type="button">Reset</button>
          </div>
        </div>
        <div class="day-summary">
          <div class="day-summary-item">
            <span>START</span>
            <strong id="todayStart">—</strong>
          </div>
          <div class="day-summary-item">
            <span>EST. END</span>
            <strong id="estimatedEnd">—</strong>
          </div>
          <label class="day-summary-target" for="workdayTarget">
            <span>TARGET</span>
            <select id="workdayTarget">
              <option value="6">6 hours</option>
              <option value="7">7 hours</option>
              <option value="7.5">7.5 hours</option>
              <option value="8" selected>8 hours</option>
              <option value="9">9 hours</option>
            </select>
          </label>
        </div>
      </section>

      <section class="timeline-section" aria-labelledby="timelineHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">THE SHAPE OF YOUR DAY</p>
            <h2 id="timelineHeading">Activity timeline</h2>
          </div>
          <span class="section-index">TODAY</span>
        </div>
        <div class="timeline-labels"></div>
        <div class="timeline-bar" id="timelineBar"></div>
        <div class="timeline-net-row">
          <div class="adjustment-total">NET ADJUSTMENT <span id="netAdjustments" class="net-time">+00:00</span></div>
        </div>
        <div class="timeline-adjuster">
          <label class="timeline-adjuster-time" for="adjustmentTime">
            <span>AT</span>
            <input id="adjustmentTime" type="time" aria-label="Adjustment time">
          </label>
          <label class="timeline-adjuster-minutes" for="manualMinutes">
            <span>MINUTES</span>
            <input type="number" id="manualMinutes" value="10" min="1" inputmode="numeric">
          </label>
          <button id="addBtn" class="adjustment-action adjustment-add" type="button" title="Add work time at selected point" aria-label="Add work time at selected point">+</button>
          <button id="subtractBtn" class="adjustment-action adjustment-subtract" type="button" title="Remove work time from selected point" aria-label="Remove work time from selected point">−</button>
          <span id="timelineAdjustmentMessage" class="timeline-adjustment-message" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="history-section" aria-labelledby="historyHeading">
        <div class="history-heading">
          <div>
            <p class="eyebrow">LOOKING BACK</p>
            <h2 id="historyHeading">Recent days</h2>
          </div>
          <button class="history-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#historyCollapse" aria-expanded="false" aria-controls="historyCollapse">
            <span id="historyToggleText">Show History</span>
            <i id="historyToggleIcon" aria-hidden="true">▼</i>
          </button>
        </div>
        <div class="collapse" id="historyCollapse">
          <h3 class="visually-hidden">Last 7 Days</h3>
          <ul id="historyList" class="list-group history-list"></ul>
        </div>
      </section>
    </main>
    <footer class="app-footer">
      <a href="https://github.com/SteffenTunkel/time-tracker" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/SteffenTunkel/time-tracker/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">Apache License 2.0</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
